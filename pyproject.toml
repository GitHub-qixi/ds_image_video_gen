version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lgx", email = "3535680189@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dashscope>=1.14.0",
    "fastapi>=0.115.0",
    "openai>=1.0.0",
